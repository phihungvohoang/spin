<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Wheels Responsive Spin</title>
    <style>
        :root {
            --hw-orange: #ff4500;
            --hw-blue: #003399;
            --hw-yellow: #ffcc00;
            --sidebar-width: 320px;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            flex-direction: row;
        }

        /* Vùng quay chính */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            transition: all 0.3s;
        }

        .wheel-box {
            position: relative;
            width: 90vw;
            max-width: 500px;
            aspect-ratio: 1 / 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #222;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.3);
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .pointer {
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 0; height: 0;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 35px solid #d32f2f;
            z-index: 100;
        }

        .center-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20%; height: 20%;
            background: #000;
            border: 3px solid #444;
            border-radius: 50%;
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--hw-yellow); font-size: 0.8rem; text-align: center;
        }

        /* Sidebar quản lý */
        .sidebar {
            width: var(--sidebar-width);
            background: #1e1e1e;
            border-left: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 150;
        }

        .input-group { display: flex; margin-bottom: 15px; gap: 5px; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: none; background: #333; color: white; }
        .btn-add { padding: 10px 15px; background: var(--hw-orange); border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .entry-list { flex: 1; overflow-y: auto; margin-top: 10px; }
        .entry-item {
            background: #2a2a2a; margin-bottom: 5px; padding: 10px;
            display: flex; justify-content: space-between; align-items: center; border-radius: 4px;
        }
        .btn-delete { color: #ff4d4d; cursor: pointer; padding: 5px; }

        /* Responsive cho Mobile */
        @media (max-width: 850px) {
            body { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; border-left: none; border-top: 2px solid #333; }
            .main-container { min-height: 80vh; }
            .wheel-box { max-width: 350px; }
        }

        /* Popup */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; }
        .popup {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; color: black; padding: 30px; border-radius: 15px; text-align: center; z-index: 201; width: 80%; max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="main-container" id="spinArea">
        <h2 style="color: var(--hw-yellow); margin-bottom: 20px;">HOT WHEELS SPIN</h2>
        <div class="wheel-box">
            <div class="pointer"></div>
            <div class="center-logo">HOT<br>WHEELS</div>
            <canvas id="wheel" width="600" height="600"></canvas>
        </div>
    </div>

    <div class="sidebar">
        <h3>Entries (<span id="countTag">8</span>)</h3>
        <div class="input-group">
            <input type="text" id="newEntry" placeholder="Thêm phần quà...">
            <button class="btn-add" onclick="addEntry()">+</button>
        </div>
        <div class="entry-list" id="entryList"></div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <h2 id="status">KẾT QUẢ</h2>
        <h1 id="prizeText" style="word-wrap: break-word;">---</h1>
        <button onclick="closePopup()" style="padding: 12px 30px; background: var(--hw-orange); color: white; border: none; border-radius: 5px; cursor: pointer;">ĐÓNG</button>
    </div>
